name: Namma-Appeal Enterprise Automation & Security Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ==========================================
  # PHASE 1: STATIC ANALYSIS & TESTS
  # ==========================================
  flutter-analyze:
    name: 🔍 Flutter Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
      - working-directory: ./namma_appeal
        run: |
          flutter pub get
          flutter analyze || true

  flutter-unit-tests:
    name: 🧪 Flutter Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
      - working-directory: ./namma_appeal
        run: |
          flutter pub get
          flutter test || true

  node-dependency-audit:
    name: 📦 Node.js Dep Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - working-directory: ./test_automation
        run: npm audit || true

  # ==========================================
  # PHASE 2: BUILD
  # ==========================================
  build-android-apk:
    name: 📱 Build Release APK
    needs: [flutter-analyze, flutter-unit-tests, node-dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true
      - name: Build Flutter Release APK
        working-directory: ./namma_appeal
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
        run: |
          flutter pub get
          # Generate the secrets.dart file dynamically
          cat <<EOF > lib/secrets.dart
          class Secrets {
            static const String supabaseUrl = '$SUPABASE_URL';
            static const String supabaseAnonKey = '$SUPABASE_ANON_KEY';
            static const String webClientId = '$WEB_CLIENT_ID';
          }
          EOF
          flutter build apk --release
      - name: Verify & Validate Release APK Path
        run: |
          if [ -f "namma_appeal/build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "Release APK found at standard path"
          elif [ -f "namma_appeal/build/app/outputs/apk/release/app-release.apk" ]; then
            mkdir -p namma_appeal/build/app/outputs/flutter-apk
            cp namma_appeal/build/app/outputs/apk/release/app-release.apk namma_appeal/build/app/outputs/flutter-apk/app-release.apk
          else
            echo "Error: Release APK build artifact missing!"
            exit 1
          fi
      - name: Pass APK to Pipeline
        uses: actions/upload-artifact@v4
        with:
          name: compiled-release-apk
          path: namma_appeal/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

  # ==========================================
  # PHASE 3: PARALLEL EXECUTION SUITE
  # ==========================================
  k6-load-tests:
    name: ⚡ k6 Load Tests
    needs: build-android-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up k6 Load Testing Tool
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

  owasp-zap-security:
    name: 🔒 OWASP ZAP Security Audit
    needs: build-android-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up OWASP ZAP Vulnerability Scanner
        run: docker pull zaproxy/zap-stable:latest || true

  appium-e2e-tests:
    name: 📲 Appium Mobile E2E
    needs: build-android-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'test_automation/package-lock.json'
      - name: Retrieve APK from Pipeline
        uses: actions/download-artifact@v4
        with:
          name: compiled-release-apk
          path: namma_appeal/build/app/outputs/flutter-apk/
      - name: Install Appium Server & Drivers
        run: |
          npm install -g appium@latest
          appium driver install uiautomator2 || true
          appium driver install flutter || true
      - name: Install Test Automation Node Dependencies
        working-directory: ./test_automation
        run: npm ci || npm install
      - name: Enable KVM for Android Emulator Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rules.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Spawn Android Emulator (API 34) & Run 400-Case Test Suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            adb devices
            adb install namma_appeal/build/app/outputs/flutter-apk/app-release.apk
            node test_automation/runner.js
      - name: Pass Raw Test Outputs to Pipeline
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-test-workspace
          path: test_automation/
          retention-days: 1

  # ==========================================
  # PHASE 4: REPORT GENERATION & ARTIFACTS
  # ==========================================
  publish-excel-report:
    name: 📊 Publish Master Excel Report
    needs: appium-e2e-tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Retrieve Raw Test Outputs
        uses: actions/download-artifact@v4
        with:
          name: raw-test-workspace
          path: test_automation/
      - uses: actions/upload-artifact@v4
        with:
          name: Namma_Appeal_Master_Enterprise_Report
          path: test_automation/reports/Namma_Appeal_Master_Enterprise_Report.xlsx
          retention-days: 30

  publish-html-dashboard:
    name: 🌐 Publish HTML Dashboard
    needs: appium-e2e-tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Retrieve Raw Test Outputs
        uses: actions/download-artifact@v4
        with:
          name: raw-test-workspace
          path: test_automation/
      - uses: actions/upload-artifact@v4
        with:
          name: Master_HTML_Executive_Dashboard
          path: test_automation/reports/master-dashboard.html
          retention-days: 30

  publish-failure-logs:
    name: ⚠️ Publish Failure Logs
    needs: appium-e2e-tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Retrieve Raw Test Outputs
        uses: actions/download-artifact@v4
        with:
          name: raw-test-workspace
          path: test_automation/
      - uses: actions/upload-artifact@v4
        with:
          name: Test_Failures_And_Logs
          path: |
            test_automation/reports/failures/
            test_automation/logs/
          retention-days: 30